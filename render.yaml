# Render Blueprint — one web service + a free Postgres database.
# Deploy: push this repo to GitHub, then on render.com:
#   New + -> Blueprint -> pick this repo -> set HOST_KEY when prompted -> Apply.
services:
  - type: web
    name: or-bachelor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: HOST_KEY          # your secret for the /host dashboard — you choose it at deploy
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: or-bachelor-db
          property: connectionString

databases:
  - name: or-bachelor-db
    plan: free
